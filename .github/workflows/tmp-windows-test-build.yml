# Temporary: builds a Windows x64 portable package for manual testing. Do not merge.
name: Tmp Windows Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: Package windows-x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
          cache-key: tmp-windows-test-x86_64-pc-windows-msvc
          cache-on-failure: 'true'
          save-cache: always
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/ci/install-nsis.ps1
      - name: Prepare bundled ConPTY
        run: python scripts/release/prepare_conpty.py
      - name: Package native application (Windows MSVC)
        shell: pwsh
        env:
          NYATERM_ARTIFACT_VERSION: tmp-test
          NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
          NYATERM_VERSION: 2.0.2
          TARGET: x86_64-pc-windows-msvc
        run: |
          python scripts/release/package_native.py "$env:TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-windows-x64
          path: dist/*portable.zip
          if-no-files-found: error
          retention-days: 3
